<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>גשר שפות עברית 🇮🇱 ⇄ 🇷🇺 רוסית - ניהול מערכת</title>
    <style>
        :root {
            --primary-color: #1e293b; /* כחול-אפור רוסי כהה */
            --secondary-color: #475569;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        h2, h3 { color: var(--primary-color); margin-top: 0; }
        .hidden { display: none !important; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0f172a; }
        .room-link-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .rooms-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .room-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 200px;
        }
        .room-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .room-actions button {
            width: auto;
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-top: 0;
        }
        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        .btn-qr { background-color: #2563eb; }
        .btn-qr:hover { background-color: #1d4ed8; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }

        #chat-interface {
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            height: 100dvh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        @media (min-width: 768px) {
            #chat-interface {
                height: 90vh;
                max-height: 850px;
                border-radius: 12px;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                border: 1px solid #e2e8f0;
                margin: auto;
            }
        }
        header.chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
