<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>גשר שפות עברית 🇮🇱 ⇄ 🇷🇺 רוסית</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230f172a%22/><text x=%2250%25%22 y=%2268%25%22 font-family=%22system-ui, -apple-system, sans-serif%22 font-weight=%22800%22 font-size=%2262%22 fill=%22%2338bdf8%22 text-anchor=%22middle%22>א</text></svg>">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        h2, h3 { color: var(--primary-color); margin-top: 0; }
        .hidden { display: none !important; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1e40af; }
        .room-link-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .rooms-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .room-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 200px;
        }
        .room-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .room-actions button {
            width: auto;
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-top: 0;
        }
        .btn-success { background-color: #10b981; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-qr { background-color: #2563eb; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #ef4444; }

        #chat-interface {
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            height: 100dvh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        @media (min-width: 768px) {
            #chat-interface {
                height: 90vh;
                max-height: 850px;
                border-radius: 12px;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                border: 1px solid #e2e8f0;
                margin: auto;
            }
        }
        header.chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        header.chat-header h1 {
            margin: 0;
            font-size: 1rem;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f1f5f9;
            -webkit-overflow-scrolling: touch;
        }
     
        .message.hebrew {
            align-self: flex-start;
            background-color: #ffffff;
            border-right: 5px solid var(--secondary-color);
        }
        .message.russian {
            align-self: flex-end;
            background-color: #eff6ff;
            border-left: 5px solid var(--primary-color);
            direction: ltr;
            text-align: left;
        }
        .author-tag {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 3px;
            display: block;
        }
        .message .msg-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px;
            margin: 0;
            opacity: 0.7;
            width: auto;
            border-radius: 50%;
        }
        .speak-btn:hover { opacity: 1; }
        
        @keyframes pulse-ring-ru {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .speak-btn.playing {
            opacity: 1;
            color: #2563eb;
            animation: pulse-ring-ru 1.5s infinite;
        }

        .message .meta {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
            display: block;
            text-align: left;
        }
        .message.russian .meta {
            text-align: right;
        }
        
        .room-bar {
            background: #e2e8f0;
            padding: 4px 12px;
            font-size: 0.75rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #cbd5e1;
            flex-shrink: 0;
        }
        .typing-indicator {
            font-size: 0.75rem;
            color: #64748b;
            padding: 2px 10px;
            font-style: italic;
            min-height: 16px;
        }

        .input-area {
            padding: 8px 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        textarea {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            height: 38px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
        }
        button.send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            margin-top: 0;
            font-size: 1.1rem;
            height: 38px;
        }
        button.mic-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 0 10px;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            margin-top: 0;
            font-size: 1rem;
            height: 38px;
            transition: background 0.2s;
        }
        button.mic-btn.listening {
            background-color: #ef4444;
            animation: pulse-ring-ru 1.5s infinite;
        }
        
        .qr-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .qr-modal-content {
            background: white;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .qr-modal-content img {
            width: 180px;
            height: 180px;
            border-radius: 6px;
        }
        .closed-notice {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ef4444;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            gap: 8px;
        }
        .site-footer {
            text-align: center;
            font-size: 0.65rem;
            color: #64748b;
            padding: 4px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <main id="admin-container" class="container hidden">
        <div id="login-screen" class="card" style="text-align: center;">
            <h2>🔐 כניסת מנהל מערכת</h2>
            <p>הכנס סיסמת ניהול:</p>
            <input type="password" id="password-input" placeholder="סיסמה (ברירת מחדל: 1234)" onkeydown="if(event.key==='Enter') checkPassword()">
            <button onclick="checkPassword()">הכנס</button>
        </div>

        <div id="dashboard" class="card hidden">
            <h2>🛠️ ניהול חדרי שיחה (🇮🇱 ⇄ 🇷🇺)</h2>
            <div style="margin-top: 15px;">
                <h3>➕ יצירת חדר</h3>
                <input type="text" id="room-name-input" placeholder="שם החדר (למשל: קבוצה-1)" onkeydown="if(event.key==='Enter') createRoomLink()">
                <button onclick="createRoomLink()">צור קישור</button>
                
                <div id="result-area" class="hidden">
                    <div id="generated-link" class="room-link-box"></div>
                    <div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">
                        <button class="btn-success" onclick="copyLink()" style="flex: 1;">העתק 📋</button>
                        <button class="btn-whatsapp" onclick="shareWhatsApp()" style="flex: 1;">וואטסאפ 📱</button>
                        <button class="btn-qr" onclick="showQRModal(document.getElementById('generated-link').innerText)" style="flex: 1;">QR 📷</button>
                    </div>
                </div>
            </div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

            <div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>📋 חדרים פעילים (רוסית)</h3>
                    <button style="width: auto; padding: 4px 10px; margin-top: 0; font-size: 0.8rem;" onclick="loadActiveRooms()">רענן 🔄</button>
                </div>
                <div id="rooms-container" class="rooms-list">
                    <p style="color: #64748b; font-size: 0.85rem;">טוען חדרים...</p>
                </div>
            </div>
        </div>
        <footer class="site-footer">היחידה לקידום נוער נוף הגליל | תוכנית היל"ה</footer>
    </main>

    <main id="chat-interface" class="hidden">
        <header class="chat-header">
            <h1 id="chat-main-title">🇮🇱 עברית ⇄ 🇷🇺 רוסית</h1>
            <div class="header-actions">
                <button class="btn-qr" onclick="showQRModal(window.location.href)" style="width: auto; padding: 4px 8px; margin-top: 0; font-size: 0.7rem;">QR 📱</button>
            </div>
        </header>

        <div class="room-bar">
            <span id="room-indicator">חדר</span>
            <span id="active-users-indicator" style="font-weight: bold; color: #1e3a8a;">👥 1</span>
        </div>

        <div id="chat-window"></div>

        <div class="input-area" id="input-area-box">
            <div id="typing-status" class="typing-indicator"></div>
            <div class="input-row">
                <textarea id="message-input" placeholder="הקלד הודעה או דבר למיקרופון..." oninput="updateTypingStatus()" onkeydown="checkEnter(event)"></textarea>
                <button id="mic-btn-element" class="mic-btn" onclick="toggleSpeechRecognition()" title="הכתבה קולית">🎤</button>
                <button id="send-btn-element" class="send-btn" onclick="sendMessage()" title="שלח">🚀</button>
            </div>
        </div>
        
        <footer class="site-footer">היחידה לקידום נוער נוף הגליל | תוכנית היל"ה</footer>
    </main>

    <div id="qr-modal-container" class="qr-modal hidden" onclick="hideQRModal()">
        <div class="qr-modal-content" onclick="event.stopPropagation()">
            <h3 style="margin: 0; color: #1e293b; font-size: 1rem;">סרוק להצטרפות 📱</h3>
            <div id="qrcode-wrapper"></div>
            <p id="qr-url-text" style="font-size: 0.7rem; color: #64748b; word-break: break-all; margin: 0;"></p>
            <button onclick="hideQRModal()" style="background-color: #64748b; margin-top: 4px; padding: 8px;">סגור</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, setDoc, deleteDoc, doc, getDocs, serverTimestamp, writeBatch, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwiBVCup-VIjX4VYEE5ay2HlHoDAaIFyA",
            authDomain: "hebrew-russian.firebaseapp.com",
            projectId: "hebrew-russian",
            storageBucket: "hebrew-russian.firebasestorage.app",
            messagingSenderId: "132280229208",
            appId: "1:132280229208:web:b12345ef2c69aeffd6d92d" // תוקן והותאם לפרויקט הרוסי
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ADMIN_PASSWORD = "1234";
        const CURRENT_LANG_TAG = "ru"; // תיוג מובהק לרוסית

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        window.showQRModal = function(url) {
            const modal = document.getElementById('qr-modal-container');
            const wrapper = document.getElementById('qrcode-wrapper');
            const textEl = document.getElementById('qr-url-text');
            const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}`;
            wrapper.innerHTML = `<img src="${qrImageUrl}" alt="QR Code">`;
            textEl.innerText = url;
            modal.classList.remove('hidden');
        };

        window.hideQRModal = function() {
            document.getElementById('qr-modal-container').classList.add('hidden');
        };

        if (roomId) {
            document.getElementById('admin-container').classList.add('hidden');
            document.getElementById('chat-interface').classList.remove('hidden');
            document.getElementById('room-indicator').innerText = `חדר: ${roomId}`;

            let userName = localStorage.getItem('bridge_chat_username_ru');
            if (!userName) {
                userName = prompt("הכנס את שמך להצטרפות לשיחה:") || "משתמש/ת";
                userName = userName.trim();
                localStorage.setItem('bridge_chat_username_ru', userName);
            }

            const chatWindow = document.getElementById('chat-window');
            const inputAreaBox = document.getElementById('input-area-box');
            const typingStatus = document.getElementById('typing-status');
            const activeUsersIndicator = document.getElementById('active-users-indicator');
            const roomDocRef = doc(db, "rooms", roomId);

            async function updatePresence() {
                try {
                    await setDoc(roomDocRef, { 
                        language: CURRENT_LANG_TAG,
                        participants: { [userName]: serverTimestamp() } 
                    }, { merge: true });
                } catch(e) {}
            }
            updatePresence();
            setInterval(updatePresence, 10000);

            onSnapshot(roomDocRef, (docSnap) => {
                if (!docSnap.exists()) {
                    chatWindow.innerHTML = `<div class="closed-notice"><span>❌ חדר שיחה זה נסגר.</span></div>`;
                    inputAreaBox.style.display = 'none';
                    return;
                }
                const data = docSnap.data();
                if (data && data.participants) {
                    const now = Date.now();
                    const activeNames = [];
                    for (const [user, time] of Object.entries(data.participants)) {
                        if ((now - (time?.toMillis ? time.toMillis() : 0)) < 15000) activeNames.push(user);
                    }
                    activeUsersIndicator.innerHTML = `👥 מחוברים: ${activeNames.length}`;
                }
                if (data && data.typing && data.typing.user && data.typing.user !== userName) {
                    if ((Date.now() - (data.typing.time?.toMillis() || 0)) < 6000) {
                        typingStatus.innerHTML = `✏️ ${escapeHtml(data.typing.user)} מקליד/ה...`;
                    } else { typingStatus.innerHTML = ''; }
                } else { typingStatus.innerHTML = ''; }
            });

            const messagesRef = collection(db, "rooms", roomId, "messages");
            onSnapshot(query(messagesRef, orderBy("timestamp", "asc")), (snapshot) => {
                chatWindow.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const msgDiv = document.createElement('div');
                    const isHebrew = data.originalLang === 'he';
                    msgDiv.className = `message ${isHebrew ? 'hebrew' : 'russian'}`;
                    
                    const textToSpeak = data.translatedText; 
                    const speakLang = isHebrew ? 'ru-RU' : 'he-IL';
                    const author = data.author || "אורח/ת";

                    msgDiv.innerHTML = `
                        <span class="author-tag">👤 ${escapeHtml(author)} (${isHebrew ? '🇮🇱 IL' : '🇷🇺 RU'})</span>
                        <div class="msg-content">
                            <div>
                                <div>${escapeHtml(data.originalText)}</div>
                                <div style="margin-top: 3px; opacity: 0.85; font-weight: 500;">${escapeHtml(data.translatedText)}</div>
                            </div>
                            <button id="btn-${docSnap.id}" class="speak-btn" onclick="speakText('${escapeHtml(textToSpeak).replace(/'/g, "\\'")}', '${speakLang}', 'btn-${docSnap.id}')" title="השמע">🔊</button>
                        </div>
                        <span class="meta">${formatTime(data.timestamp)}</span>
                    `;
                    chatWindow.appendChild(msgDiv);
                });
                setTimeout(() => { chatWindow.scrollTop = chatWindow.scrollHeight; }, 100);
            });

            window.speakText = function(text, langCode, btnId) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const btnElement = document.getElementById(btnId);
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode;
                utterance.rate = 0.9;
                if (btnElement) btnElement.classList.add('playing');
                utterance.onend = () => { if (btnElement) btnElement.classList.remove('playing'); };
                utterance.onerror = () => { if (btnElement) btnElement.classList.remove('playing'); };
                window.speechSynthesis.speak(utterance);
            };

            let recognition = null;
            let isListening = false;

            window.toggleSpeechRecognition = function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("הדפדפן אינו תומך בהכתבה קולית.");
                    return;
                }
                const micBtn = document.getElementById('mic-btn-element');
                const input = document.getElementById('message-input');

                if (isListening) {
                    if (recognition) recognition.stop();
                    return;
                }

                let currentInputLang = 'he-IL';
                const textVal = input.value.trim();
                if (textVal) {
                    currentInputLang = /[\u0590-\u05FF]/.test(textVal) ? 'he-IL' : 'ru-RU';
                }

                recognition = new SpeechRecognition();
                recognition.lang = currentInputLang; 
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.innerText = '⏹️';
                };

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    }
                    if (finalTranscript) {
                        input.value += (input.value ? ' ' : '') + finalTranscript;
                        updateTypingStatus();
                    }
                };

                recognition.onerror = () => stopMicUI();
                recognition.onend = () => stopMicUI();
                recognition.start();
            };

            function stopMicUI() {
                isListening = false;
                const micBtn = document.getElementById('mic-btn-element');
                if (micBtn) {
                    micBtn.classList.remove('listening');
                    micBtn.innerText = '🎤';
                }
            }

            let typingTimeout;
            window.updateTypingStatus = async function() {
                const input = document.getElementById('message-input');
                if (input.value.trim().length > 0) {
                    try { await setDoc(roomDocRef, { typing: { user: userName, time: serverTimestamp() } }, { merge: true }); } catch(e) {}
                }
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(async () => {
                    try { await setDoc(roomDocRef, { typing: { user: '', time: serverTimestamp() } }, { merge: true }); } catch(e) {}
                }, 3000);
            };

            window.sendMessage = async function() {
                const input = document.getElementById('message-input');
                const sendBtn = document.getElementById('send-btn-element');
                const text = input.value.trim();
                if (!text) return;

                input.value = '';
                sendBtn.disabled = true;
                try { await setDoc(roomDocRef, { typing: { user: '', time: serverTimestamp() } }, { merge: true }); } catch(e) {}

                const isHebrew = /[\u0590-\u05FF]/.test(text);
                const langPair = isHebrew ? 'he|ru' : 'ru|he';
                let translatedText = "[התרגום נכשל]";
                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
                    const data = await response.json();
                    if (data && data.responseData) translatedText = data.responseData.translatedText;
                } catch (e) {}

                try {
                    await addDoc(messagesRef, {
                        originalText: text,
                        translatedText: translatedText,
                        originalLang: isHebrew ? 'he' : 'ru',
                        author: userName,
                        timestamp: serverTimestamp()
                    });
                } catch (e) {} finally {
                    sendBtn.disabled = false;
                    setTimeout(() => { chatWindow.scrollTop = chatWindow.scrollHeight; }, 100);
                }
            };

            window.checkEnter = function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            };

        } else {
            document.getElementById('chat-interface').classList.add('hidden');
            document.getElementById('admin-container').classList.remove('hidden');

            window.checkPassword = function() {
                if (document.getElementById('password-input').value === ADMIN_PASSWORD) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadActiveRooms();
                } else { alert("סיסמה שגויה!"); }
            }

            window.createRoomLink = async function() {
                const roomName = document.getElementById('room-name-input').value.trim();
                if (!roomName) return alert("אנא הכנס שם לחדר");
                try {
                    await setDoc(doc(db, "rooms", roomName), { 
                        createdAt: serverTimestamp(), 
                        roomName: roomName,
                        language: CURRENT_LANG_TAG 
                    }, { merge: true });
                    const fullLink = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomName)}`;
                    document.getElementById('generated-link').innerText = fullLink;
                    document.getElementById('result-area').classList.remove('hidden');
                    loadActiveRooms();
                } catch (e) { alert("שגיאה ביצירת החדר."); }
            }

            window.copyLink = () => navigator.clipboard.writeText(document.getElementById('generated-link').innerText).then(() => alert("הקישור הועתק!"));
            window.shareWhatsApp = () => window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('הצטרפו לחדר: ' + document.getElementById('generated-link').innerText)}`, '_blank');

            window.loadActiveRooms = async function() {
                const container = document.getElementById('rooms-container');
                container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">טוען חדרים...</p>';
                try {
                    // שליפה וסינון לפי שפת הרוסית בלבד
                    const q = query(collection(db, "rooms"), where("language", "==", CURRENT_LANG_TAG));
                    const snap = await getDocs(q);
                    
                    container.innerHTML = '';
                    if (snap.empty) {
                        container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">אין חדרים פעילים.</p>';
                        return;
                    }
                    snap.forEach((docSnap) => {
                        const id = docSnap.id;
                        const url = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(id)}`;
                        const item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <div class="room-info">
                                <strong>🏷️ ${id}</strong>
                                <span style="font-size: 0.7rem; color: #64748b; word-break: break-all;">${url}</span>
                            </div>
                            <div class="room-actions">
                                <button onclick="window.open('${url}', '_blank')">הכנס 👁️</button>
                                <button class="btn-success" onclick="navigator.clipboard.writeText('${url}').then(() => alert('הועתק!'))">העתק 📋</button>
                                <button class="btn-whatsapp" onclick="window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent('${url}'), '_blank')">וואטסאפ 📱</button>
                                <button class="btn-qr" onclick="showQRModal('${url}')">QR 📷</button>
                                <button class="btn-warning" onclick="resetRoomMessages('${id}')">איפוס 🔄</button>
                                <button class="btn-danger" onclick="deleteRoom('${id}')">מחק 🗑️</button>
                            </div>
                        `;
                        container.appendChild(item);
                    });
                } catch (e) { container.innerHTML = '<p style="color: #ef4444; font-size: 0.85rem;">שגיאה בטעינת החדרים (ייתכן שנדרש אינדקס ב-Firebase Firestore עבור שאילתה זו).</p>'; }
            };

            window.resetRoomMessages = async function(id) {
                if (confirm(`לאפס את השיחה בחדר "${id}"?`)) {
                    try {
                        const snap = await getDocs(collection(db, "rooms", id, "messages"));
                        const batch = writeBatch(db);
                        snap.forEach((d) => batch.delete(d.ref));
                        await batch.commit();
                        alert("השיחה אופסה!");
                    } catch (e) { alert("שגיאה באיפוס."); }
                }
            };

            window.deleteRoom = async function(id) {
                if (confirm(`למחוק את החדר "${id}" לצמיתות?`)) {
                    try {
                        await deleteDoc(doc(db, "rooms", id));
                        alert("החדר נמחק!");
                        loadActiveRooms();
                    } catch (e) { alert("שגיאה במחיקה."); }
                }
            };
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function formatTime(ts) {
            if (!ts) return 'הרגע...';
            const d = ts.toDate();
            return d.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        }
    </script>
</body>
</html>
